defaults: &defaults

  logger: &logger
    output: console
    level: debug
    contexts:
      InstanceLoader: warn
      RouterExplorer: warn
      HttpException: log

  agent: &agent
    required-agents:
      - http://dr-ma:41241
      - http://analysis-ma:41241
      - http://forecast-ma:41241

stages:
  local:
    <<: *defaults
